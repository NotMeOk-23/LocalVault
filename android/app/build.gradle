plugins {
    id 'com.android.application'
}

android {
    namespace 'com.localvault.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.localvault.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Zero external dependencies needed; uses Android native WebView
}
